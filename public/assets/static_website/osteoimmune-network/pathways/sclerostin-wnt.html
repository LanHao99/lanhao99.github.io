<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SOST / sclerostin–LRP5/6</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>SOST / sclerostin–LRP5/6</h1><p>骨细胞分泌的 sclerostin 结合 LRP5/6 并抑制经典 Wnt，降低成骨分化与矿化。机械加载降低 Sost，卸载提高 Sost，使这条轴成为骨细胞感知力学环境并调节骨形成的重要出口。</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/15024046/" target="_blank" rel="noreferrer">细胞机制：PMID 15024046 ↗</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/18089564/" target="_blank" rel="noreferrer">机械负荷：PMID 18089564 ↗</a> · <a href="https://www.kegg.jp/entry/hsa04310" target="_blank" rel="noreferrer">KEGG：Wnt signaling ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04310.png" alt="KEGG 人类 Wnt 信号通路图"><small>KEGG 图展示 Wnt/LRP5/6 通用框架；sclerostin 的骨细胞来源和力学调控以原始研究为准。</small></article></body></html>
