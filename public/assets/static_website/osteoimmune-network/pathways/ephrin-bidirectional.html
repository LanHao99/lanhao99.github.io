<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ephrinB2–EphB4 双向信号</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>ephrinB2–EphB4 双向信号</h1><p>该轴需要细胞直接接触。破骨谱系 ephrinB2 的逆向信号抑制 c-Fos–NFATc1 和破骨分化；成骨细胞 EphB4 的正向信号促进成骨分化，从而把吸收阶段连接到形成阶段。</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/16890539/" target="_blank" rel="noreferrer">原始研究：PMID 16890539 ↗</a></p><small>这是一条骨细胞特异的接触型耦联轴，KEGG 暂无可直接等同的独立通路图。</small></article></body></html>
