<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JAK–STAT 细胞因子信号</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>JAK–STAT 细胞因子信号</h1><p>多种细胞因子受体可通过 JAK 激酶活化 STAT，影响细胞存活、极化和分化。该标签覆盖 ILC2 的 IL-4/IL-13–STAT6、IL-7/ATRA 情境及骨细胞–G-CSF 相关读出；并不替代原文对每个细胞因子下游的实测验证。</p><p><a href="https://www.kegg.jp/entry/hsa04630" target="_blank" rel="noreferrer">KEGG：hsa04630 JAK-STAT signaling pathway ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04630.png" alt="KEGG 人类 JAK-STAT 信号通路图"><small>通路图在线引自 KEGG；加载失败时请通过上方 KEGG 条目查看。</small></article></body></html>
