<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NK 细胞介导的细胞毒性</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>NK 细胞介导的细胞毒性</h1><p>NK 活化受体与靶细胞配体相互作用可触发细胞毒颗粒释放和凋亡。网络中该页主要解释活化 NK→MSC 和 IL-15 相关 NK→成骨细胞边；NK→破骨细胞则还必须结合 RA 滑膜的 RANKL/M-CSF 与接触条件。</p><p><a href="https://www.kegg.jp/entry/hsa04650" target="_blank" rel="noreferrer">KEGG：hsa04650 Natural killer cell mediated cytotoxicity ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04650.png" alt="KEGG 人类 NK 细胞介导细胞毒性通路图"><small>通路图在线引自 KEGG；加载失败时请通过上方 KEGG 条目查看。</small></article></body></html>
