<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TNF 信号</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>TNF 信号</h1><p>TNF-α 通过 TNFR 及下游 NF-κB/MAPK 等轴影响炎症和细胞命运。网络中它用于 HIV/ART 免疫重建相关骨丢失及 CD8 TEMRA 相关 MSC 抑制；是否为直接致效因素仍以每篇原始研究的遗传、中和或体外干预证据为准。</p><p><a href="https://www.kegg.jp/entry/hsa04668" target="_blank" rel="noreferrer">KEGG：hsa04668 TNF signaling pathway ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04668.png" alt="KEGG 人类 TNF 信号通路图"><small>通路图在线引自 KEGG；加载失败时请通过上方 KEGG 条目查看。</small></article></body></html>
