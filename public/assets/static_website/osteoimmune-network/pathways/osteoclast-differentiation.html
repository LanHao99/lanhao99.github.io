<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RANKL–RANK / 破骨分化</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>RANKL–RANK / 破骨分化</h1><p>RANKL 与破骨前体的 RANK 结合后，经过 TRAF6、NF-κB、MAPK 和 NFATc1 等转录程序促进破骨分化；OPG 可作为 RANKL 的诱饵受体。网络图中所有“促进/抑制破骨”的连线都需结合其具体细胞来源与实验情境解读。</p><p><a href="https://www.kegg.jp/entry/hsa04380" target="_blank" rel="noreferrer">KEGG：hsa04380 Osteoclast differentiation ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04380.png" alt="KEGG 人类破骨分化通路图"><small>通路图在线引自 KEGG；加载失败时请通过上方 KEGG 条目查看。</small></article></body></html>
