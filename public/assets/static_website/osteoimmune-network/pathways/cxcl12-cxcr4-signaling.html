<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CXCL12–CXCR4 趋化信号</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../骨细胞-淋系细胞相互作用网络图.html">← 返回网络图</a><article><h1>CXCL12–CXCR4 趋化信号</h1><p>CXCL12 经 CXCR4 调节趋化、驻留和定位；在网络中它连接 CAR/基质细胞、HSC 与 B 系阶段性生态位。它是生态位定位信号，不能被简化为每一种祖细胞扩增的直接因果机制。</p><p><a href="https://www.kegg.jp/entry/hsa04062" target="_blank" rel="noreferrer">KEGG：hsa04062 Chemokine signaling pathway ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04062.png" alt="KEGG 人类趋化因子信号通路图"><small>通路图在线引自 KEGG；加载失败时请通过上方 KEGG 条目查看。</small></article></body></html>
