<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TCR / 共刺激信号</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../骨细胞-淋系细胞相互作用网络图.html">← 返回网络图</a><article><h1>TCR / 共刺激信号</h1><p>TCR 激活决定 T 细胞效应程序，并与 CD40L–CD40、CTLA-4 等共刺激/共抑制相互作用协同。网络中它作为 T 细胞激活、Treg/TcREG 与 B 细胞中继的上游解释标签，不意味着每条边均已测定相同的 TCR 磷酸化读出。</p><p><a href="https://www.kegg.jp/entry/hsa04660" target="_blank" rel="noreferrer">KEGG：hsa04660 T cell receptor signaling pathway ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04660.png" alt="KEGG 人类 T 细胞受体信号通路图"><small>通路图在线引自 KEGG；加载失败时请通过上方 KEGG 条目查看。</small></article></body></html>
