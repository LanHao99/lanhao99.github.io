<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>IL-17 信号</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../骨细胞-淋系细胞相互作用网络图.html">← 返回网络图</a><article><h1>IL-17 信号</h1><p>IL-17 受体近端的 ACT1/TRAF3IP2 可连接 NF-κB、MAPK 与 C/EBP 等转录反应。它既可在 Th17 相关炎症环境中支持破骨生成，也可在骨折早期特定 γδT 情境中参与修复；不能脱离来源、时序和模型简单赋予单一骨效应。</p><p><a href="https://www.kegg.jp/entry/hsa04657" target="_blank" rel="noreferrer">KEGG：hsa04657 IL-17 signaling pathway ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04657.png" alt="KEGG 人类 IL-17 信号通路图"><small>通路图在线引自 KEGG；加载失败时请通过上方 KEGG 条目查看。</small></article></body></html>
