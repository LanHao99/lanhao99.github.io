<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>经典 Wnt 信号</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>经典 Wnt 信号</h1><p>Wnt 配体通过 Frizzled 与 LRP5/6 共同受体抑制 β-catenin 降解复合物，使 β-catenin 进入细胞核并驱动相关转录。网络中 Wnt10b 与成骨效应相连；DKK1 则为 Wnt/LRP5/6 的拮抗因子。具体方向仍取决于实验细胞和干预背景。</p><p><a href="https://www.kegg.jp/entry/hsa04310" target="_blank" rel="noreferrer">KEGG：hsa04310 Wnt signaling pathway ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04310.png" alt="KEGG 人类 Wnt 信号通路图"><small>通路图在线引自 KEGG；加载失败时请通过上方 KEGG 条目查看。</small></article></body></html>
