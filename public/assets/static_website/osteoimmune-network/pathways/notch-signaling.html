<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jagged–Notch</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>Jagged–Notch 信号</h1><p>Jagged/DLL 等膜配体与 Notch 受体接触后，Notch 胞内段（NICD）被释放并同 RBPJ/MAML 复合体调控转录。网络中该页服务于成骨细胞–HSC 生态位的 Jagged1–Notch1 证据，不应泛化为全部成骨细胞作用。</p><p><a href="https://www.kegg.jp/entry/hsa04330" target="_blank" rel="noreferrer">KEGG：hsa04330 Notch signaling pathway ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04330.png" alt="KEGG 人类 Notch 信号通路图"><small>通路图在线引自 KEGG；加载失败时请通过上方 KEGG 条目查看。</small></article></body></html>
