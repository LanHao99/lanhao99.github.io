<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CTHRC1–WAIF1 耦联</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>CTHRC1–WAIF1 耦联</h1><p>活跃、贴附矿化基质的成熟破骨细胞分泌 CTHRC1。CTHRC1 结合基质/成骨前体表面的 WAIF1（TPBG/5T4），经 PKCδ–MEK/ERK 促进成骨分化与募集；破骨细胞特异性 Cthrc1 缺失会损害吸收后的骨量恢复。</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/23908115/" target="_blank" rel="noreferrer">CTHRC1 原始研究：PMID 23908115 ↗</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/29624737/" target="_blank" rel="noreferrer">WAIF1 受体研究：PMID 29624737 ↗</a></p><small>CTHRC1–WAIF1 尚无可直接对应的 KEGG 独立通路图。</small></article></body></html>
