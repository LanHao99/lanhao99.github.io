<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SEMA4D–PLXNB1 抗耦联</title><style>body{max-width:980px;margin:0 auto;padding:28px;background:#071018;color:#e8f2f7;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:#7ed7ff}img{display:block;max-width:100%;height:auto;margin:22px 0;background:#fff}article{padding:20px;border:1px solid #294454;border-radius:14px;background:#0d1b26}small{color:#91a8b8}</style></head><body><a href="../network.html">← 返回网络图</a><article><h1>SEMA4D–PLXNB1 抗耦联</h1><p>破骨细胞膜结合或可溶性 SEMA4D 结合成骨细胞 PLXNB1，激活 RhoA，抑制 IGF-1 信号、细胞迁移与骨形成。遗传缺失和 OVX 抗体干预支持该轴具有因果作用。</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/22019888/" target="_blank" rel="noreferrer">原始研究：PMID 22019888 ↗</a> · <a href="https://www.kegg.jp/entry/hsa04360" target="_blank" rel="noreferrer">KEGG：Axon guidance ↗</a></p><img src="https://www.kegg.jp/kegg/pathway/hsa/hsa04360.png" alt="KEGG 人类轴突导向通路图"><small>KEGG 图提供 semaphorin/plexin 上下文；骨重塑中的 SEMA4D–PLXNB1–RhoA 效应以原始研究为准。</small></article></body></html>
