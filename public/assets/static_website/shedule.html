<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef3ef">
    <meta name="description" content="2026-2027 学年第一学期，23 级临床医学八年制四班课程表。">
    <title>临床八年制四班课表 · 2026-2027（1）</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #eef3ef;
            --bg-deep: #dfe9e2;
            --surface: rgba(255, 255, 255, .88);
            --surface-solid: #ffffff;
            --surface-soft: #f6f8f6;
            --text: #18201c;
            --muted: #66716b;
            --faint: #929d96;
            --line: rgba(24, 32, 28, .11);
            --line-strong: rgba(24, 32, 28, .2);
            --brand: #176b4d;
            --brand-strong: #0c4f38;
            --brand-soft: #dcefe6;
            --warm: #d47731;
            --shadow: 0 18px 52px rgba(37, 57, 46, .09);
            --shadow-soft: 0 8px 26px rgba(37, 57, 46, .07);
        }

        html[data-theme="night"] {
            color-scheme: dark;
            --bg: #0c1210;
            --bg-deep: #080d0b;
            --surface: rgba(22, 31, 27, .9);
            --surface-solid: #161f1b;
            --surface-soft: #1b2722;
            --text: #edf4ef;
            --muted: #a9b6ae;
            --faint: #78867e;
            --line: rgba(237, 244, 239, .1);
            --line-strong: rgba(237, 244, 239, .18);
            --brand: #6bd3a6;
            --brand-strong: #a1ebca;
            --brand-soft: #18382b;
            --warm: #f0a462;
            --shadow: 0 22px 58px rgba(0, 0, 0, .28);
            --shadow-soft: 0 10px 28px rgba(0, 0, 0, .2);
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
            scroll-behavior: smooth;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at 12% -12%, color-mix(in srgb, var(--brand) 15%, transparent), transparent 34rem),
                radial-gradient(circle at 92% 4%, color-mix(in srgb, var(--warm) 10%, transparent), transparent 28rem),
                linear-gradient(180deg, var(--bg), var(--bg-deep));
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: color .25s ease, background-color .25s ease;
        }

        button {
            color: inherit;
            font: inherit;
        }

        button:focus-visible,
        [tabindex]:focus-visible {
            outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent);
            outline-offset: 3px;
        }

        .shell {
            width: min(1500px, 100%);
            margin: 0 auto;
            padding: max(18px, env(safe-area-inset-top)) clamp(14px, 3vw, 42px) max(32px, env(safe-area-inset-bottom));
        }

        .topbar {
            display: flex;
            min-height: 58px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 4px;
        }

        .topbar-brand {
            display: flex;
            min-width: 0;
            align-items: baseline;
            gap: 10px;
        }

        .topbar-brand strong {
            font-family: Georgia, "Songti SC", "STSong", serif;
            font-size: 1.08rem;
            letter-spacing: -.02em;
        }

        .topbar-brand span {
            overflow: hidden;
            color: var(--muted);
            font-size: .74rem;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar-actions {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            gap: 9px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--brand-soft);
            letter-spacing: .04em;
            text-transform: none;
        }

        .status-pill::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--brand);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent);
            content: "";
        }

        .theme-toggle,
        .toolbar-button,
        .tab-button,
        .event-card,
        .month-day,
        .day-jump,
        .modal-close {
            border: 0;
            cursor: pointer;
        }

        .theme-toggle {
            justify-self: end;
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            gap: 9px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface-solid);
            box-shadow: var(--shadow-soft);
            font-size: .84rem;
            font-weight: 700;
        }

        .theme-icon {
            display: grid;
            width: 24px;
            height: 24px;
            place-items: center;
            border-radius: 50%;
            background: var(--brand-soft);
            color: var(--brand-strong);
        }

        .micro-label {
            display: block;
            margin-bottom: 10px;
            color: var(--faint);
            font-size: .68rem;
            font-weight: 850;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .view-tabs {
            position: sticky;
            z-index: 50;
            top: max(10px, env(safe-area-inset-top));
            display: grid;
            width: fit-content;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 18px auto;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: color-mix(in srgb, var(--surface-solid) 88%, transparent);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(18px);
        }

        .tab-button {
            min-height: 42px;
            padding: 9px 18px;
            border-radius: 11px;
            background: transparent;
            color: var(--muted);
            font-size: .86rem;
            font-weight: 750;
            white-space: nowrap;
        }

        .tab-button[aria-selected="true"] {
            background: var(--text);
            color: var(--surface-solid);
            box-shadow: 0 6px 18px color-mix(in srgb, var(--text) 18%, transparent);
        }

        .panel {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
        }

        .toolbar {
            display: flex;
            min-height: 72px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px clamp(14px, 3vw, 28px);
            border-bottom: 1px solid var(--line);
        }

        .toolbar-copy {
            min-width: 0;
        }

        .toolbar-kicker {
            margin: 0 0 4px;
            color: var(--brand-strong);
            font-size: .7rem;
            font-weight: 850;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .toolbar-title {
            margin: 0;
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            line-height: 1.25;
        }

        .toolbar-actions {
            display: flex;
            flex-shrink: 0;
            gap: 7px;
        }

        .toolbar-button {
            display: inline-grid;
            min-width: 42px;
            min-height: 42px;
            place-items: center;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface-solid);
            color: var(--text);
            font-weight: 750;
        }

        .toolbar-button.text-button {
            font-size: .8rem;
        }

        .week-board {
            position: relative;
            overflow-x: auto;
            padding: 16px;
            scroll-padding: 16px;
            scrollbar-color: var(--line-strong) transparent;
        }

        .timeline-grid {
            display: grid;
            min-width: 1080px;
            grid-template-columns: 72px repeat(5, minmax(190px, 1fr));
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface-solid);
        }

        .timeline-corner,
        .timeline-day-head {
            position: sticky;
            top: 0;
            z-index: 4;
            min-height: 66px;
            border-bottom: 1px solid var(--line);
            background: color-mix(in srgb, var(--surface-soft) 92%, var(--surface-solid));
        }

        .timeline-corner {
            left: 0;
            z-index: 6;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .08em;
        }

        .day-jump {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 12px;
            background: transparent;
            text-align: left;
        }

        .timeline-day-head.is-today {
            box-shadow: inset 0 3px 0 var(--brand);
        }

        .timeline-day-head.is-selected {
            background: color-mix(in srgb, var(--brand-soft) 58%, var(--surface-solid));
        }

        .day-name {
            font-size: .78rem;
            font-weight: 800;
        }

        .day-date {
            color: var(--muted);
            font-size: .72rem;
            font-weight: 650;
        }

        .day-count {
            display: grid;
            min-width: 24px;
            height: 24px;
            place-items: center;
            padding: 0 7px;
            border-radius: 999px;
            background: var(--surface-soft);
            color: var(--muted);
            font-size: .68rem;
            font-weight: 800;
        }

        .time-axis,
        .timeline-day {
            position: relative;
            height: 620px;
        }

        .time-axis {
            position: sticky;
            left: 0;
            z-index: 5;
            border-right: 1px solid var(--line);
            background: color-mix(in srgb, var(--surface-soft) 94%, var(--surface-solid));
        }

        .time-label {
            position: absolute;
            right: 10px;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: .65rem;
            font-weight: 760;
            font-variant-numeric: tabular-nums;
        }

        .time-label.is-end {
            transform: translateY(-100%);
        }

        .timeline-day {
            border-right: 1px solid var(--line);
            background: color-mix(in srgb, var(--surface-solid) 94%, var(--surface-soft));
        }

        .timeline-day:last-child {
            border-right: 0;
        }

        .timeline-day.is-today {
            background: color-mix(in srgb, var(--brand-soft) 24%, var(--surface-solid));
        }

        .timeline-day.is-selected {
            box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--brand) 32%, transparent);
        }

        .time-guide {
            position: absolute;
            right: 0;
            left: 0;
            border-top: 1px dashed color-mix(in srgb, var(--line-strong) 62%, transparent);
        }

        .time-break {
            position: absolute;
            top: 288px;
            right: 0;
            left: 0;
            display: grid;
            height: 44px;
            place-items: center;
            border-block: 1px solid var(--line);
            background: repeating-linear-gradient(-45deg, transparent 0 8px, color-mix(in srgb, var(--line) 52%, transparent) 8px 9px);
            color: var(--faint);
            font-size: .6rem;
            font-weight: 750;
            letter-spacing: .08em;
        }

        .event-card {
            position: absolute;
            z-index: 2;
            top: var(--event-top);
            right: 5px;
            left: 5px;
            width: calc(100% - 10px);
            height: var(--event-height);
            min-height: 46px;
            overflow: hidden;
            padding: 8px 9px 8px 12px;
            border: 1px solid color-mix(in srgb, var(--course) 36%, var(--line));
            border-radius: 11px;
            background: color-mix(in srgb, var(--course) 15%, var(--surface-solid));
            box-shadow: 0 5px 14px color-mix(in srgb, var(--course) 9%, transparent);
            text-align: left;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }

        .event-card::before {
            position: absolute;
            top: 7px;
            bottom: 7px;
            left: 0;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--course);
            content: "";
        }

        .event-card:hover {
            transform: translateY(-2px);
            border-color: color-mix(in srgb, var(--course) 64%, var(--line));
            box-shadow: 0 10px 24px color-mix(in srgb, var(--course) 12%, transparent);
        }

        .event-card[data-kind="exam"] {
            --course: #d76552 !important;
        }

        .event-time {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
            color: color-mix(in srgb, var(--course) 72%, var(--text));
            font-size: .68rem;
            font-weight: 850;
            letter-spacing: .03em;
        }

        .event-type {
            padding: 3px 6px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--course) 14%, transparent);
            font-size: .58rem;
        }

        .event-title {
            display: block;
            font-size: .8rem;
            font-weight: 800;
            line-height: 1.3;
        }

        .event-summary {
            display: -webkit-box;
            overflow: hidden;
            margin-top: 5px;
            color: var(--muted);
            font-size: .67rem;
            font-weight: 620;
            line-height: 1.35;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .event-card.is-compact {
            padding-block: 5px;
        }

        .event-card.is-compact .event-time {
            margin-bottom: 2px;
        }

        .event-card.is-compact .event-summary {
            display: none;
        }

        .month-wrap {
            overflow-x: auto;
            padding: 16px;
        }

        .month-grid {
            display: grid;
            min-width: 760px;
            grid-template-columns: repeat(5, minmax(140px, 1fr));
            gap: 1px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--line);
        }

        .month-weekday {
            padding: 12px 8px;
            background: var(--surface-soft);
            color: var(--muted);
            font-size: .72rem;
            font-weight: 800;
            text-align: center;
        }

        .month-day {
            min-height: 148px;
            padding: 12px;
            background: var(--surface-solid);
            text-align: left;
            vertical-align: top;
        }

        .month-day.is-empty {
            background: color-mix(in srgb, var(--surface-soft) 72%, transparent);
            cursor: default;
        }

        .month-day.is-today {
            box-shadow: inset 0 0 0 2px var(--brand);
        }

        .month-number {
            display: flex;
            align-items: center;
            gap: 7px;
            width: fit-content;
            min-width: 32px;
            min-height: 32px;
            margin-bottom: 9px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: .8rem;
            font-weight: 850;
        }

        .month-number small {
            color: var(--muted);
            font-size: .63rem;
            font-weight: 700;
        }

        .month-day.is-today .month-number small {
            color: inherit;
            opacity: .78;
        }

        .month-day.is-today .month-number {
            background: var(--brand);
            color: var(--surface-solid);
        }

        .month-events {
            display: grid;
            gap: 4px;
        }

        .month-event {
            overflow: hidden;
            padding: 6px 8px;
            border-left: 3px solid var(--course);
            border-radius: 7px;
            background: color-mix(in srgb, var(--course) 10%, var(--surface-soft));
            font-size: .68rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .month-more {
            color: var(--muted);
            font-size: .62rem;
            font-weight: 700;
        }

        .dashboard {
            display: grid;
            gap: 16px;
            padding: 16px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .kpi-card,
        .dashboard-card {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: color-mix(in srgb, var(--surface-solid) 78%, transparent);
        }

        .kpi-card {
            min-height: 132px;
            padding: 20px;
        }

        .kpi-value {
            margin: 8px 0 4px;
            font-family: Georgia, "Songti SC", serif;
            font-size: clamp(2rem, 4vw, 3.4rem);
            letter-spacing: -.04em;
            line-height: 1;
        }

        .kpi-label {
            margin: 0;
            color: var(--muted);
            font-size: .78rem;
            line-height: 1.5;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr);
            gap: 16px;
        }

        .dashboard-card {
            padding: clamp(18px, 3vw, 28px);
        }

        .card-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 22px;
        }

        .card-title {
            margin: 0 0 5px;
            font-size: 1.05rem;
        }

        .progress-track {
            display: block;
            width: 100%;
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: color-mix(in srgb, var(--line-strong) 46%, transparent);
        }

        .progress-fill {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: var(--progress-color, var(--brand));
        }

        .kpi-card .progress-track {
            margin-top: 12px;
        }

        .remaining-list {
            display: grid;
            gap: 13px;
        }

        .remaining-row {
            display: grid;
            grid-template-columns: minmax(120px, 180px) minmax(120px, 1fr) 54px;
            gap: 12px;
            align-items: center;
        }

        .remaining-name {
            display: block;
            overflow: hidden;
            font-size: .78rem;
            font-weight: 780;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remaining-meta {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: .64rem;
        }

        .remaining-track {
            display: flex;
            height: 12px;
            overflow: hidden;
            border-radius: 99px;
            background: var(--surface-soft);
        }

        .remaining-segment {
            height: 100%;
            background: var(--segment-color);
        }

        .remaining-value {
            color: var(--muted);
            font-size: .72rem;
            font-weight: 750;
            text-align: right;
        }

        .count-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-top: 10px;
        }

        .count-legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: .68rem;
            font-weight: 700;
        }

        .count-legend i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--legend-color);
        }

        .type-summary {
            display: grid;
            align-content: start;
            gap: 12px;
        }

        .type-cards {
            display: grid;
            gap: 10px;
        }

        .type-card {
            padding: 14px;
            border: 1px solid color-mix(in srgb, var(--type-color) 24%, var(--line));
            border-radius: 14px;
            background: color-mix(in srgb, var(--type-color) 8%, var(--surface-soft));
        }

        .type-card-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .type-card-name {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: .8rem;
            font-weight: 800;
        }

        .type-card-name::before {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--type-color);
            content: "";
        }

        .type-card-total {
            font-family: Georgia, "Songti SC", serif;
            font-size: 1.22rem;
            font-weight: 700;
        }

        .type-card .progress-fill {
            background: var(--type-color);
        }

        .type-card-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
            color: var(--muted);
            font-size: .66rem;
            font-weight: 700;
        }

        .exam-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .exam-item {
            display: grid;
            width: 100%;
            grid-template-columns: 52px minmax(0, 1fr);
            gap: 12px;
            align-items: center;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface-soft);
            color: inherit;
            text-align: left;
            cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
        }

        .exam-item:hover {
            transform: translateY(-2px);
            border-color: color-mix(in srgb, #d76552 42%, var(--line));
            background: color-mix(in srgb, #d76552 8%, var(--surface-soft));
        }

        .exam-date {
            padding: 8px 4px;
            border-radius: 10px;
            background: color-mix(in srgb, #d76552 12%, var(--surface-solid));
            color: color-mix(in srgb, #d76552 75%, var(--text));
            font-size: .68rem;
            font-weight: 850;
            text-align: center;
        }

        .exam-title {
            margin: 0 0 4px;
            font-size: .78rem;
            font-weight: 800;
            line-height: 1.45;
        }

        .exam-time {
            color: var(--muted);
            font-size: .68rem;
        }

        dialog {
            width: min(680px, calc(100% - 28px));
            max-height: calc(100dvh - 28px);
            margin: auto;
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--surface-solid);
            color: var(--text);
            box-shadow: 0 30px 90px rgba(0, 0, 0, .32);
        }

        dialog::backdrop {
            background: rgba(5, 12, 9, .54);
            backdrop-filter: blur(8px);
        }

        .modal-accent {
            height: 8px;
            background: var(--course);
        }

        .modal-body {
            max-height: calc(100dvh - 36px);
            overflow-y: auto;
            padding: 24px;
        }

        .modal-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .modal-title {
            margin: 0;
            font-size: 1.55rem;
            line-height: 1.25;
        }

        .modal-close {
            display: grid;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            place-items: center;
            border-radius: 50%;
            background: var(--surface-soft);
            font-size: 1.2rem;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 22px;
        }

        .modal-field {
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface-soft);
        }

        .modal-field.wide {
            grid-column: 1 / -1;
        }

        .modal-field-label {
            display: block;
            margin-bottom: 5px;
            color: var(--faint);
            font-size: .62rem;
            font-weight: 850;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .modal-field-value {
            font-size: .86rem;
            font-weight: 700;
            line-height: 1.5;
        }

        .teaching-menu {
            grid-column: 1 / -1;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface-soft);
        }

        .teaching-menu-heading {
            display: flex;
            min-height: 48px;
            align-items: center;
            gap: 12px;
            margin: 0;
            padding: 12px 14px;
            font-size: .8rem;
            font-weight: 820;
            border-bottom: 1px solid var(--line);
        }

        .session-list {
            display: grid;
            gap: 8px;
            padding: 12px;
        }

        .session-item {
            display: grid;
            grid-template-columns: 92px minmax(0, 1fr);
            gap: 12px;
            padding: 12px;
            border-radius: 11px;
            background: var(--surface-solid);
        }

        .session-time {
            color: color-mix(in srgb, var(--course) 72%, var(--text));
            font-size: .7rem;
            font-weight: 840;
            font-variant-numeric: tabular-nums;
        }

        .session-topic {
            margin: 0 0 5px;
            font-size: .82rem;
            font-weight: 790;
            line-height: 1.5;

        .session-meta {
            display: block;
            color: var(--muted);
            font-size: .68rem;
            line-height: 1.55;
        }

            .tab-button {

            .week-board {
                margin-inline: -1px;
                padding: 8px;

            .timeline-grid {

            }

            .timeline-corner,
            .timeline-day-head {
                min-height: 60px;

            .time-label {
                right: 7px;

            }

            .event-card {

            .month-grid {

                grid-template-columns: 1fr;
                gap: 8px;

            .month-number {

                grid-template-columns: 1fr;
                gap: 5px;

                .replace(/[：:]/g, "；")
                .split(/[；;]/)
                .map(part => part.trim())
                .filter(Boolean)
                .forEach(part => {
                    const marker = locationMarker(part);
                    if (marker) {
                        if (marker === activeBucket && /地点/.test(part) && buckets[marker]) buckets[marker] = [];
                        activeBucket = marker;
                        if (!["generic", "ignore"].includes(marker)) hasTypedMarker = true;
                        return;
                    }
                    if (activeBucket !== "ignore") buckets[activeBucket].push(part);
                });

            const formatParts = parts => [...new Set(parts)].join(" · ");
            if (buckets[targetType].length) return formatParts(buckets[targetType]);
            if (targetType === "theory" && buckets.generic.length) return formatParts(buckets.generic);
            if (!hasTypedMarker && buckets.generic.length) return formatParts(buckets.generic);
            return "";
        }

        function courseNameFor(title) {
            const course = COURSES.find(item => title.includes(item.name));
            return course ? course.name : title.split("-")[0];
        }

        function occurrenceTypeFor(sessionType) {
            if (/PBL|CBL/i.test(sessionType)) return "discussion";
            if (/见习|实践/.test(sessionType)) return "practice";
            return "theory";
        }

        function eventOccurrenceTypes(event) {
            if (event.kind !== "course") return [];
            const sessionTypes = teachingDetail(event).sessions.map(session => occurrenceTypeFor(session.type));
            const labeledType = eventType(event.title, event.kind);
            const titleType = labeledType === "PBL" || labeledType === "CBL"
                ? "discussion"
                : labeledType === "见习" ? "practice" : null;
            if (titleType && !sessionTypes.includes(titleType)) return [titleType];
            if (sessionTypes.length) return [...new Set(sessionTypes)];
            return [titleType || "theory"];
        }

        function isRemainingEvent(event, now = new Date()) {
            const todayKey = formatYmd(now);
            return event.date > todayKey || (event.date === todayKey && event.end >= currentTimeString(now));
        }

        function scheduleOccurrences(now = new Date()) {
            return EVENTS.filter(event => event.kind === "course").flatMap(event =>
                eventOccurrenceTypes(event).map(category => ({
                    eventId: event.id,
                    course: courseNameFor(event.title),
                    category,
                    remaining: isRemainingEvent(event, now)
                }))
            );
        }

        function timeMinutes(value) {
            const [hours, minutes] = value.split(":").map(Number);
            return hours * 60 + minutes;
        }

        function eventSegments(event) {
            const start = timeMinutes(event.start);
            const end = timeMinutes(event.end);
            const segments = [];
            if (start < MORNING_END && end > MORNING_START) {
                segments.push({ start: Math.max(start, MORNING_START), end: Math.min(end, MORNING_END), period: "morning" });
            }
            if (start < AFTERNOON_END && end > AFTERNOON_START) {
                segments.push({ start: Math.max(start, AFTERNOON_START), end: Math.min(end, AFTERNOON_END), period: "afternoon" });
            }
            return segments;
        }

        function segmentPosition(segment) {
            const periodStart = segment.period === "morning" ? MORNING_START : AFTERNOON_START;
            const base = segment.period === "morning" ? 0 : MORNING_HEIGHT + BREAK_HEIGHT;
            return {
                top: base + (segment.start - periodStart) * TIME_SCALE,
                height: (segment.end - segment.start) * TIME_SCALE
            };
        }

        function currentTimeString(date = new Date()) {
            return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
        }

        function semesterStatus() {
            const current = new Date();
            const currentDay = new Date(current.getFullYear(), current.getMonth(), current.getDate(), 12);
            if (currentDay < TERM_START) {
                const days = Math.ceil((TERM_START - currentDay) / 86400000);
                return `距开课 ${days} 天`;
            }
            if (currentDay > TERM_END) return "本学期已结束";
            const week = Math.min(19, Math.floor((currentDay - TERM_START) / 604800000) + 1);
            return `教学第 ${week} 周`;
        }

        function updateContextualHeader() {
            document.getElementById("semesterStatus").textContent = semesterStatus();
        }

        function minutesString(value) {
            return `${String(Math.floor(value / 60)).padStart(2, "0")}:${String(value % 60).padStart(2, "0")}`;
        }

        function eventCard(event, segment) {
            const type = eventType(event.title, event.kind);
            const detail = teachingDetail(event);
            const position = segmentPosition(segment);
            const compact = position.height < 84;
            return `
                <button class="event-card${compact ? " is-compact" : ""}" type="button" data-event-id="${event.id}" data-kind="${event.kind}" style="--course:${event.kind === "exam" ? "#d76552" : colorFor(event.title)};--event-top:${position.top}px;--event-height:${position.height}px" aria-label="查看 ${escapeHtml(event.title)} 的教学详情">
                    <span class="event-time"><span>${minutesString(segment.start)}—${minutesString(segment.end)}</span><span class="event-type">${type}</span></span>
                    <strong class="event-title">${escapeHtml(event.title)}</strong>
                    <span class="event-summary">${escapeHtml(detail.summary)}</span>
                </button>
            `;
        }

        function toolbar(kicker, title, unit) {
            return `
                <div class="toolbar">
                    <div class="toolbar-copy">
                        <p class="toolbar-kicker">${kicker}</p>
                        <h2 class="toolbar-title">${title}</h2>
                    </div>
                    <div class="toolbar-actions">
                        <button class="toolbar-button" type="button" data-action="prev-${unit}" aria-label="上一${unit === "week" ? "周" : "月"}">‹</button>
                        <button class="toolbar-button text-button" type="button" data-action="today">定位今日</button>
                        <button class="toolbar-button" type="button" data-action="next-${unit}" aria-label="下一${unit === "week" ? "周" : "月"}">›</button>
                    </div>
                </div>
            `;
        }

        function renderWeek() {
            const days = Array.from({ length: 5 }, (_, index) => addDays(state.weekStart, index));
            const end = days[4];
            const title = `${state.weekStart.getFullYear()} 年 ${state.weekStart.getMonth() + 1} 月 ${state.weekStart.getDate()} 日 — ${end.getMonth() + 1} 月 ${end.getDate()} 日`;
            const todayKey = formatYmd(weekdayAnchor(new Date()));
            app.innerHTML = `
                <section class="panel">
                    ${toolbar(`第 ${Math.max(1, Math.min(19, Math.floor((state.weekStart - TERM_START) / 604800000) + 1))} 教学周`, title, "week")}
                    <div class="week-board" aria-label="一周课程安排">
                        <div class="timeline-grid">
                            <div class="timeline-corner">时间</div>
                            ${days.map((date, index) => {
                                const dateKey = formatYmd(date);
                                const dayEvents = eventsOn(dateKey);
                                const classes = ["timeline-day-head"];
                                if (dateKey === todayKey) classes.push("is-today");
                                if (dateKey === state.selectedDate) classes.push("is-selected");
                                return `
                                    <div class="${classes.join(" ")}" data-day-column="${dateKey}">
                                        <button class="day-jump" type="button" data-date="${dateKey}">
                                            <span><span class="day-name">${WEEKDAYS[index]}</span><br><span class="day-date">${date.getMonth() + 1} 月 ${date.getDate()} 日</span></span>
                                            <span class="day-count">${dayEvents.length}</span>
                                        </button>
                                    </div>
                                `;
                            }).join("")}
                            <div class="time-axis" aria-hidden="true">
                                ${TIME_MARKS.map(([label, top], index) => `<span class="time-label${index === TIME_MARKS.length - 1 ? " is-end" : ""}" style="top:${top}px">${label}</span>`).join("")}
                            </div>
                            ${days.map(date => {
                            const dateKey = formatYmd(date);
                            const dayEvents = eventsOn(dateKey);
                            const classes = ["timeline-day"];
                            if (dateKey === todayKey) classes.push("is-today");
                            if (dateKey === state.selectedDate) classes.push("is-selected");
                            return `
                                <div class="${classes.join(" ")}" data-timeline-date="${dateKey}">
                                    ${TIME_MARKS.map(([, top]) => `<span class="time-guide" style="top:${top}px" aria-hidden="true"></span>`).join("")}
                                    <span class="time-break" aria-hidden="true">午休</span>
                                    ${dayEvents.flatMap(event => eventSegments(event).map(segment => eventCard(event, segment))).join("")}
                                </div>
                            `;
                            }).join("")}
                        </div>
                    </div>
                </section>
            `;
            requestAnimationFrame(() => {
                const selected = document.querySelector(`[data-day-column="${state.selectedDate}"]`);
                selected?.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
            });
        }

        function renderMonth() {
            const year = state.monthStart.getFullYear();
            const month = state.monthStart.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const weekdays = Array.from({ length: daysInMonth }, (_, index) => new Date(year, month, index + 1, 12))
                .filter(date => date.getDay() >= 1 && date.getDay() <= 5);
            const leadingCells = (weekdays[0].getDay() + 6) % 7;
            const days = [...Array(leadingCells).fill(null), ...weekdays];
            const todayKey = formatYmd(weekdayAnchor(new Date()));
            app.innerHTML = `
                <section class="panel">
                    ${toolbar("学期月历", `${year} 年 ${month + 1} 月`, "month")}
                    <div class="month-wrap">
                        <div class="month-grid">
                            ${WEEKDAYS.map(day => `<div class="month-weekday">${day}</div>`).join("")}
                            ${days.map(date => {
                                if (!date) return `<div class="month-day is-empty" aria-hidden="true"></div>`;
                                const dateKey = formatYmd(date);
                                const dayEvents = eventsOn(dateKey);
                                const classes = ["month-day"];
                                if (dateKey === todayKey) classes.push("is-today");
                                return `
                                    <button class="${classes.join(" ")}" type="button" data-date="${dateKey}" aria-label="查看 ${formatDate(dateKey)} 的安排">
                                        <span class="month-number">${date.getDate()} <small>${WEEKDAYS[date.getDay() - 1]}</small></span>
                                        <span class="month-events">
                                            ${dayEvents.slice(0, 4).map(event => `<span class="month-event" style="--course:${event.kind === "exam" ? "#d76552" : colorFor(event.title)}">${event.start} · ${escapeHtml(event.title)}</span>`).join("")}
                                            ${dayEvents.length > 4 ? `<span class="month-more">另 ${dayEvents.length - 4} 项</span>` : ""}
                                            ${dayEvents.length === 0 ? `<span class="month-more">无安排</span>` : ""}
                                        </span>
                                    </button>
                                `;
                            }).join("")}
                        </div>
                    </div>
                </section>
            `;
        }

        function renderDashboard() {
            const occurrences = scheduleOccurrences();
            const remainingOccurrences = occurrences.filter(item => item.remaining);
            const completedOccurrences = occurrences.length - remainingOccurrences.length;
            const progressPercent = occurrences.length ? Math.round(completedOccurrences / occurrences.length * 100) : 0;
            const courseStats = COURSES.map(course => {
                const all = occurrences.filter(item => item.course === course.name);
                const remaining = all.filter(item => item.remaining);
                return {
                    ...course,
                    total: all.length,
                    remaining: remaining.length,
                    completed: all.length - remaining.length,
                    counts: Object.fromEntries(OCCURRENCE_TYPES.map(type => [
                        type.key,
                        remaining.filter(item => item.category === type.key).length
                    ]))
                };
            }).sort((a, b) => b.remaining - a.remaining || b.total - a.total);
            const maxRemaining = Math.max(1, ...courseStats.map(course => course.remaining));
            const typeStats = OCCURRENCE_TYPES.map(type => {
                const all = occurrences.filter(item => item.category === type.key);
                const remaining = all.filter(item => item.remaining);
                const completed = all.length - remaining.length;
                return {
                    ...type,
                    total: all.length,
                    remaining: remaining.length,
                    completed,
                    progress: all.length ? Math.round(completed / all.length * 100) : 0
                };
            });
            const exams = EVENTS.filter(event => event.kind === "exam");
            const formalExams = exams.filter(event => !event.title.includes("情景模拟"));
            app.innerHTML = `
                <section class="panel">
                    <div class="toolbar">
                        <div class="toolbar-copy">
                            <h2 class="toolbar-title">2026—2027 学年第一学期 · 数据看板</h2>
                        </div>
                    </div>
                    <div class="dashboard">
                        <div class="kpi-grid">
                            <article class="kpi-card"><span class="micro-label">课程规模</span><div class="kpi-value">12</div><p class="kpi-label">11 门必修 · 1 门选修</p></article>
                            <article class="kpi-card"><span class="micro-label">教学周期</span><div class="kpi-value">19</div><p class="kpi-label">2026.09.07—2027.01.17</p></article>
                            <article class="kpi-card"><span class="micro-label">课程进度</span><div class="kpi-value">${progressPercent}%</div><p class="kpi-label">已完成 ${completedOccurrences} 次 · 剩余 ${remainingOccurrences.length} 次</p><span class="progress-track"><span class="progress-fill" style="width:${progressPercent}%"></span></span></article>
                            <article class="kpi-card"><span class="micro-label">考核安排</span><div class="kpi-value">${exams.length}</div><p class="kpi-label">${formalExams.length} 场正式考试 · 1 场情景考核</p></article>
                        </div>

                        <div class="dashboard-grid">
                            <article class="dashboard-card">
                                <div class="card-heading"><h3 class="card-title">剩余课程统计</h3></div>
                                <div class="count-legend">
                                    ${OCCURRENCE_TYPES.map(type => `<span><i style="--legend-color:${type.color}"></i>${type.label}</span>`).join("")}
                                </div>
                                <div class="remaining-list">
                                    ${courseStats.map(course => `
                                        <div class="remaining-row">
                                            <span class="remaining-name" title="${course.name}">${course.name}<small class="remaining-meta">剩余 ${course.remaining} / 共 ${course.total} 次</small></span>
                                            <span class="remaining-track">
                                                ${OCCURRENCE_TYPES.map(type => course.counts[type.key] ? `<span class="remaining-segment" title="${type.label}剩余 ${course.counts[type.key]} 次" style="--segment-color:${type.color};width:${course.counts[type.key] / maxRemaining * 100}%"></span>` : "").join("")}
                                            </span>
                                            <span class="remaining-value">${course.remaining} 次</span>
                                        </div>
                                    `).join("")}
                                </div>
                            </article>

                            <article class="dashboard-card type-summary">
                                <div class="card-heading"><h3 class="card-title">教学类型统计</h3></div>
                                <div class="type-cards">
                                    ${typeStats.map(type => `
                                        <div class="type-card" style="--type-color:${type.color}">
                                            <div class="type-card-head"><span class="type-card-name">${type.label}</span><strong class="type-card-total">${type.total} 次</strong></div>
                                            <span class="progress-track"><span class="progress-fill" style="width:${type.progress}%"></span></span>
                                            <div class="type-card-meta"><span>已完成 ${type.completed}</span><span>剩余 ${type.remaining}</span></div>
                                        </div>
                                    `).join("")}
                                </div>
                            </article>
                        </div>

                        <article class="dashboard-card">
                            <div class="card-heading"><h3 class="card-title">考核时间线</h3></div>
                            <div class="exam-list">
                                ${exams.map(event => `
                                    <button class="exam-item" type="button" data-jump-date="${event.date}" aria-label="跳转到 ${formatDate(event.date)} 的课表">
                                        <div class="exam-date">${parseDate(event.date).getMonth() + 1}/${parseDate(event.date).getDate()}</div>
                                        <div><p class="exam-title">${escapeHtml(event.title)}</p><span class="exam-time">${event.start}—${event.end} · 第 ${event.week} 周</span></div>
                                    </button>
                                `).join("")}
                            </div>
                        </article>
                    </div>
                </section>
            `;
        }

        function render() {
            document.querySelectorAll("[data-view]").forEach(button => {
                button.setAttribute("aria-selected", String(button.dataset.view === state.view));
            });
            if (state.view === "week") renderWeek();
            if (state.view === "month") renderMonth();
            if (state.view === "dashboard") renderDashboard();
            updateContextualHeader();
        }

        function openEvent(event) {
            const courseColor = event.kind === "exam" ? "#d76552" : colorFor(event.title);
            const detail = teachingDetail(event);
            const labeledType = eventType(event.title, event.kind);
            const sessions = detail.sessions.map(session => {
                const displayType = ["PBL", "CBL", "见习"].includes(labeledType) ? labeledType : session.type;
                const location = locationForType(session.location, displayType);
                const meta = [
                    displayType ? `形式：${displayType}` : "",
                    session.teacher ? `教师：${session.teacher}` : "",
                    location ? `地点：${location}` : ""
                ].filter(Boolean).join(" · ");
                return `
                    <article class="session-item">
                        <span class="session-time">${session.start}—${session.end}</span>
                        <div><p class="session-topic">${escapeHtml(session.content)}</p>${meta ? `<span class="session-meta">${escapeHtml(meta)}</span>` : ""}</div>
                    </article>
                `;
            }).join("");
            document.getElementById("modalAccent").style.setProperty("--course", courseColor);
            dialog.style.setProperty("--course", courseColor);
            document.getElementById("modalTitle").textContent = event.title;
            document.getElementById("modalGrid").innerHTML = `
                <div class="modal-field"><span class="modal-field-label">日期</span><span class="modal-field-value">${formatDate(event.date)}</span></div>
                <div class="modal-field"><span class="modal-field-label">时间</span><span class="modal-field-value">${event.start}—${event.end}</span></div>
                ${sessions ? `<section class="teaching-menu"><h3 class="teaching-menu-heading">详细教学安排</h3><div class="session-list">${sessions}</div></section>` : ""}
            `;
            dialog.showModal();
        }

        document.querySelector(".view-tabs").addEventListener("click", event => {
            const button = event.target.closest("[data-view]");
            if (!button) return;
            state.view = button.dataset.view;
            render();
        });

        app.addEventListener("click", event => {
            const jumpButton = event.target.closest("[data-jump-date]");
            if (jumpButton) {
                const date = weekdayAnchor(parseDate(jumpButton.dataset.jumpDate));
                state.selectedDate = formatYmd(date);
                state.weekStart = startOfWeek(date);
                state.monthStart = new Date(date.getFullYear(), date.getMonth(), 1);
                state.view = "week";
                render();
                return;
            }

            const eventButton = event.target.closest("[data-event-id]");
            if (eventButton) {
                const selected = EVENTS.find(item => item.id === Number(eventButton.dataset.eventId));
                if (selected) openEvent(selected);
                return;
            }

            const dateButton = event.target.closest("[data-date]");
            if (dateButton) {
                const date = parseDate(dateButton.dataset.date);
                state.selectedDate = dateButton.dataset.date;
                if (state.view === "month") {
                    state.weekStart = startOfWeek(date);
                    state.view = "week";
                }
                render();
                return;
            }

            const actionButton = event.target.closest("[data-action]");
            if (!actionButton) return;
            const action = actionButton.dataset.action;
            if (action === "prev-week" || action === "next-week") {
                state.weekStart = addDays(state.weekStart, action === "prev-week" ? -7 : 7);
                state.selectedDate = formatYmd(state.weekStart);
            }
            if (action === "prev-month" || action === "next-month") {
                state.monthStart = new Date(state.monthStart.getFullYear(), state.monthStart.getMonth() + (action === "prev-month" ? -1 : 1), 1);
            }
            if (action === "today") {
                const current = new Date();
                const anchor = weekdayAnchor(current < TERM_START ? TERM_START : current > TERM_END ? TERM_END : current);
                state.selectedDate = formatYmd(anchor);
                state.weekStart = startOfWeek(anchor);
                state.monthStart = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
            }
            render();
        });

        document.getElementById("modalClose").addEventListener("click", () => dialog.close());
        dialog.addEventListener("click", event => {
            if (event.target === dialog) dialog.close();
        });

        function nextThemeBoundary(now = new Date()) {
            const boundary = new Date(now);
            if (now.getHours() < 8) boundary.setHours(8, 0, 0, 0);
            else if (now.getHours() < 18) boundary.setHours(18, 0, 0, 0);
            else {
                boundary.setDate(boundary.getDate() + 1);
                boundary.setHours(8, 0, 0, 0);
            }
            return boundary;
        }

        function automaticTheme(now = new Date()) {
            return now.getHours() >= 18 || now.getHours() < 8 ? "night" : "day";
        }

        function storedTheme(now = new Date()) {
            try {
                const stored = JSON.parse(localStorage.getItem(THEME_KEY));
                if (stored && stored.expiresAt > now.getTime() && ["day", "night"].includes(stored.theme)) return stored.theme;
                localStorage.removeItem(THEME_KEY);
            } catch (_) {
                localStorage.removeItem(THEME_KEY);
            }
            return automaticTheme(now);
        }

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            const night = theme === "night";
            document.getElementById("themeIcon").textContent = night ? "☀" : "☾";
            document.getElementById("themeText").textContent = night ? "日间模式" : "夜间模式";
            document.getElementById("themeToggle").setAttribute("aria-label", night ? "切换为日间模式" : "切换为夜间模式");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", night ? "#0c1210" : "#eef3ef");
        }

        document.getElementById("themeToggle").addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "night" ? "day" : "night";
            localStorage.setItem(THEME_KEY, JSON.stringify({ theme: next, expiresAt: nextThemeBoundary().getTime() }));
            applyTheme(next);
        });

        function scheduleThemeSync() {
            const delay = Math.min(nextThemeBoundary().getTime() - Date.now() + 1000, 2147483647);
            window.setTimeout(() => {
                applyTheme(storedTheme());
                scheduleThemeSync();
            }, Math.max(delay, 1000));
        }

        applyTheme(storedTheme());
        scheduleThemeSync();
        render();
    </script>
</body>

</html>
