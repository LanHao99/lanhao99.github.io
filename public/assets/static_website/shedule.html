<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef3ef">
    <meta name="description" content="2026-2027 学年第一学期，23 级临床医学八年制四班课程表。">
    <title>临床八年制四班课表 · 2026-2027（1）</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #eef3ef;
            --bg-deep: #dfe9e2;
            --surface: rgba(255, 255, 255, .88);
            --surface-solid: #ffffff;
            --surface-soft: #f6f8f6;
            --text: #18201c;
            --muted: #66716b;
            --faint: #929d96;
            --line: rgba(24, 32, 28, .11);
            --line-strong: rgba(24, 32, 28, .2);
            --brand: #176b4d;
            --brand-strong: #0c4f38;
            --brand-soft: #dcefe6;
            --warm: #d47731;
            --shadow: 0 18px 52px rgba(37, 57, 46, .09);
            --shadow-soft: 0 8px 26px rgba(37, 57, 46, .07);
        }

        html[data-theme="night"] {
            color-scheme: dark;
            --bg: #0c1210;
            --bg-deep: #080d0b;
            --surface: rgba(22, 31, 27, .9);
            --surface-solid: #161f1b;
            --surface-soft: #1b2722;
            --text: #edf4ef;
            --muted: #a9b6ae;
            --faint: #78867e;
            --line: rgba(237, 244, 239, .1);
            --line-strong: rgba(237, 244, 239, .18);
            --brand: #6bd3a6;
            --brand-strong: #a1ebca;
            --brand-soft: #18382b;
            --warm: #f0a462;
            --shadow: 0 22px 58px rgba(0, 0, 0, .28);
            --shadow-soft: 0 10px 28px rgba(0, 0, 0, .2);
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
            scroll-behavior: smooth;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at 12% -12%, color-mix(in srgb, var(--brand) 15%, transparent), transparent 34rem),
                radial-gradient(circle at 92% 4%, color-mix(in srgb, var(--warm) 10%, transparent), transparent 28rem),
                linear-gradient(180deg, var(--bg), var(--bg-deep));
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: color .25s ease, background-color .25s ease;
        }

        button {
            color: inherit;
            font: inherit;
        }

        button:focus-visible,
        [tabindex]:focus-visible {
            outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent);
            outline-offset: 3px;
        }

        .shell {
            width: min(1500px, 100%);
            margin: 0 auto;
            padding: max(18px, env(safe-area-inset-top)) clamp(14px, 3vw, 42px) max(32px, env(safe-area-inset-bottom));
        }

        .topbar {
            display: flex;
            min-height: 58px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 4px;
        }

        .topbar-brand {
            display: flex;
            min-width: 0;
            align-items: baseline;
            gap: 10px;
        }

        .topbar-brand strong {
            font-family: Georgia, "Songti SC", "STSong", serif;
            font-size: 1.08rem;
            letter-spacing: -.02em;
        }

        .topbar-brand span {
            overflow: hidden;
            color: var(--muted);
            font-size: .74rem;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar-actions {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            gap: 9px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--brand-soft);
            letter-spacing: .04em;
            text-transform: none;
        }

        .status-pill::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--brand);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent);
            content: "";
        }

        .about-title {
            margin: 0 0 12px;
            font-family: Georgia, "Songti SC", "STSong", serif;
            font-size: clamp(1.55rem, 4vw, 2.3rem);
            font-weight: 600;
            letter-spacing: -.035em;
            line-height: 1.1;
        }

        .hero-description {
            max-width: 760px;
            margin: 0;
            color: var(--muted);
            font-size: .84rem;
            line-height: 1.7;
        }

        .about-details {
            margin-top: 16px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: color-mix(in srgb, var(--surface-solid) 72%, transparent);
            box-shadow: var(--shadow-soft);
        }

        .about-details summary {
            display: flex;
            min-height: 52px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 18px;
            color: var(--muted);
            font-size: .78rem;
            font-weight: 750;
            cursor: pointer;
            list-style: none;
        }

        .about-details summary::-webkit-details-marker {
            display: none;
        }

        .about-details summary::after {
            color: var(--brand-strong);
            content: "＋";
            font-size: 1.1rem;
        }

        .about-details[open] summary::after {
            content: "－";
        }

        .about-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(240px, 360px);
            gap: 24px;
            align-items: end;
            padding: 6px 18px 20px;
        }

        .theme-toggle,
        .next-card,
        .toolbar-button,
        .tab-button,
        .event-card,
        .month-day,
        .day-jump,
        .modal-close {
            border: 0;
            cursor: pointer;
        }

        .theme-toggle {
            justify-self: end;
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            gap: 9px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface-solid);
            box-shadow: var(--shadow-soft);
            font-size: .84rem;
            font-weight: 700;
        }

        .theme-icon {
            display: grid;
            width: 24px;
            height: 24px;
            place-items: center;
            border-radius: 50%;
            background: var(--brand-soft);
            color: var(--brand-strong);
        }

        .next-card {
            width: 100%;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: color-mix(in srgb, var(--surface-solid) 86%, transparent);
            text-align: left;
            box-shadow: var(--shadow-soft);
            cursor: default;
        }

        .micro-label {
            display: block;
            margin-bottom: 10px;
            color: var(--faint);
            font-size: .68rem;
            font-weight: 850;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .next-title {
            display: block;
            margin-bottom: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .next-meta {
            display: block;
            color: var(--muted);
            font-size: .82rem;
            line-height: 1.6;
        }

        .view-tabs {
            position: sticky;
            z-index: 50;
            top: max(10px, env(safe-area-inset-top));
            display: grid;
            width: fit-content;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 18px auto;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: color-mix(in srgb, var(--surface-solid) 88%, transparent);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(18px);
        }

        .tab-button {
            min-height: 42px;
            padding: 9px 18px;
            border-radius: 11px;
            background: transparent;
            color: var(--muted);
            font-size: .86rem;
            font-weight: 750;
            white-space: nowrap;
        }

        .tab-button[aria-selected="true"] {
            background: var(--text);
            color: var(--surface-solid);
            box-shadow: 0 6px 18px color-mix(in srgb, var(--text) 18%, transparent);
        }

        .panel {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
        }

        .toolbar {
            display: flex;
            min-height: 72px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px clamp(14px, 3vw, 28px);
            border-bottom: 1px solid var(--line);
        }

        .toolbar-copy {
            min-width: 0;
        }

        .toolbar-kicker {
            margin: 0 0 4px;
            color: var(--brand-strong);
            font-size: .7rem;
            font-weight: 850;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .toolbar-title {
            margin: 0;
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            line-height: 1.25;
        }

        .toolbar-actions {
            display: flex;
            flex-shrink: 0;
            gap: 7px;
        }

        .toolbar-button {
            display: inline-grid;
            min-width: 42px;
            min-height: 42px;
            place-items: center;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface-solid);
            color: var(--text);
            font-weight: 750;
        }

        .toolbar-button.text-button {
            font-size: .8rem;
        }

        .week-board {
            display: grid;
            grid-template-columns: repeat(5, minmax(210px, 1fr));
            gap: 10px;
            overflow-x: auto;
            padding: 16px;
            scroll-padding: 16px;
            scroll-snap-type: x proximity;
            scrollbar-color: var(--line-strong) transparent;
        }

        .day-column {
            min-height: 440px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: color-mix(in srgb, var(--surface-solid) 72%, transparent);
            scroll-snap-align: center;
        }

        .day-column.is-today {
            border-color: color-mix(in srgb, var(--brand) 46%, var(--line));
            box-shadow: inset 0 3px 0 var(--brand);
        }

        .day-column.is-selected {
            background: color-mix(in srgb, var(--brand-soft) 42%, var(--surface-solid));
        }

        .day-jump {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 15px;
            border-bottom: 1px solid var(--line);
            background: transparent;
            text-align: left;
        }

        .day-name {
            font-size: .78rem;
            font-weight: 800;
        }

        .day-date {
            color: var(--muted);
            font-size: .72rem;
            font-weight: 650;
        }

        .day-count {
            display: grid;
            min-width: 24px;
            height: 24px;
            place-items: center;
            padding: 0 7px;
            border-radius: 999px;
            background: var(--surface-soft);
            color: var(--muted);
            font-size: .68rem;
            font-weight: 800;
        }

        .event-list {
            display: grid;
            gap: 9px;
            padding: 10px;
        }

        .event-card {
            position: relative;
            width: 100%;
            overflow: hidden;
            padding: 12px 12px 12px 15px;
            border: 1px solid color-mix(in srgb, var(--course) 36%, var(--line));
            border-radius: 13px;
            background: color-mix(in srgb, var(--course) 12%, var(--surface-solid));
            text-align: left;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }

        .event-card::before {
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 0;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--course);
            content: "";
        }

        .event-card:hover {
            transform: translateY(-2px);
            border-color: color-mix(in srgb, var(--course) 64%, var(--line));
            box-shadow: 0 10px 24px color-mix(in srgb, var(--course) 12%, transparent);
        }

        .event-card[data-kind="exam"] {
            --course: #d76552 !important;
        }

        .event-card[data-kind="holiday"] {
            --course: #d69a31 !important;
            cursor: default;
        }

        .event-time {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
            color: color-mix(in srgb, var(--course) 72%, var(--text));
            font-size: .68rem;
            font-weight: 850;
            letter-spacing: .03em;
        }

        .event-type {
            padding: 3px 6px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--course) 14%, transparent);
            font-size: .58rem;
        }

        .event-title {
            display: block;
            font-size: .88rem;
            font-weight: 800;
            line-height: 1.45;
        }

        .empty-day {
            display: grid;
            min-height: 120px;
            place-items: center;
            padding: 20px;
            color: var(--faint);
            font-size: .76rem;
            text-align: center;
        }

        .term-note {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            align-items: center;
            padding: 14px 20px 18px;
            color: var(--muted);
            font-size: .74rem;
            line-height: 1.6;
        }

        .term-note strong {
            color: var(--text);
        }

        .month-wrap {
            overflow-x: auto;
            padding: 16px;
        }

        .month-grid {
            display: grid;
            min-width: 760px;
            grid-template-columns: repeat(5, minmax(140px, 1fr));
            gap: 1px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--line);
        }

        .month-weekday {
            padding: 12px 8px;
            background: var(--surface-soft);
            color: var(--muted);
            font-size: .72rem;
            font-weight: 800;
            text-align: center;
        }

        .month-day {
            min-height: 148px;
            padding: 12px;
            background: var(--surface-solid);
            text-align: left;
            vertical-align: top;
        }

        .month-day.is-empty {
            background: color-mix(in srgb, var(--surface-soft) 72%, transparent);
            cursor: default;
        }

        .month-day.is-today {
            box-shadow: inset 0 0 0 2px var(--brand);
        }

        .month-number {
            display: flex;
            align-items: center;
            gap: 7px;
            width: fit-content;
            min-width: 32px;
            min-height: 32px;
            margin-bottom: 9px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: .8rem;
            font-weight: 850;
        }

        .month-number small {
            color: var(--muted);
            font-size: .63rem;
            font-weight: 700;
        }

        .month-day.is-today .month-number small {
            color: inherit;
            opacity: .78;
        }

        .month-day.is-today .month-number {
            background: var(--brand);
            color: var(--surface-solid);
        }

        .month-events {
            display: grid;
            gap: 4px;
        }

        .month-event {
            overflow: hidden;
            padding: 6px 8px;
            border-left: 3px solid var(--course);
            border-radius: 7px;
            background: color-mix(in srgb, var(--course) 10%, var(--surface-soft));
            font-size: .68rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .month-more {
            color: var(--muted);
            font-size: .62rem;
            font-weight: 700;
        }

        .dashboard {
            display: grid;
            gap: 16px;
            padding: 16px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .kpi-card,
        .dashboard-card {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: color-mix(in srgb, var(--surface-solid) 78%, transparent);
        }

        .kpi-card {
            min-height: 132px;
            padding: 20px;
        }

        .kpi-value {
            margin: 8px 0 4px;
            font-family: Georgia, "Songti SC", serif;
            font-size: clamp(2rem, 4vw, 3.4rem);
            letter-spacing: -.04em;
            line-height: 1;
        }

        .kpi-label {
            margin: 0;
            color: var(--muted);
            font-size: .78rem;
            line-height: 1.5;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr);
            gap: 16px;
        }

        .dashboard-card {
            padding: clamp(18px, 3vw, 28px);
        }

        .card-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 22px;
        }

        .card-title {
            margin: 0 0 5px;
            font-size: 1.05rem;
        }

        .card-subtitle {
            margin: 0;
            color: var(--muted);
            font-size: .74rem;
            line-height: 1.55;
        }

        .hours-list {
            display: grid;
            gap: 13px;
        }

        .hours-row {
            display: grid;
            grid-template-columns: minmax(100px, 160px) minmax(100px, 1fr) 52px;
            gap: 12px;
            align-items: center;
        }

        .hours-name {
            overflow: hidden;
            font-size: .78rem;
            font-weight: 750;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hours-track {
            height: 8px;
            overflow: hidden;
            border-radius: 99px;
            background: var(--surface-soft);
        }

        .hours-bar {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--brand), color-mix(in srgb, var(--brand) 55%, var(--warm)));
        }

        .hours-value {
            color: var(--muted);
            font-size: .72rem;
            font-weight: 750;
            text-align: right;
        }

        .composition {
            display: grid;
            justify-items: center;
            gap: 22px;
        }

        .donut {
            position: relative;
            display: grid;
            width: min(230px, 70vw);
            aspect-ratio: 1;
            place-items: center;
            border-radius: 50%;
            background: conic-gradient(var(--brand) 0 60.37%, var(--warm) 60.37% 85.37%, #8f79c6 85.37% 100%);
        }

        .donut::after {
            position: absolute;
            width: 64%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--surface-solid);
            content: "";
        }

        .donut-copy {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .donut-value {
            display: block;
            font-family: Georgia, serif;
            font-size: 2.2rem;
        }

        .donut-label {
            color: var(--muted);
            font-size: .68rem;
        }

        .legend {
            display: grid;
            width: 100%;
            gap: 10px;
        }

        .legend-row {
            display: grid;
            grid-template-columns: 11px 1fr auto;
            gap: 10px;
            align-items: center;
            color: var(--muted);
            font-size: .76rem;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--dot);
        }

        .legend-row strong {
            color: var(--text);
        }

        .exam-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .exam-item {
            display: grid;
            width: 100%;
            grid-template-columns: 52px minmax(0, 1fr);
            gap: 12px;
            align-items: center;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface-soft);
            color: inherit;
            text-align: left;
            cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
        }

        .exam-item:hover {
            transform: translateY(-2px);
            border-color: color-mix(in srgb, #d76552 42%, var(--line));
            background: color-mix(in srgb, #d76552 8%, var(--surface-soft));
        }

        .exam-date {
            padding: 8px 4px;
            border-radius: 10px;
            background: color-mix(in srgb, #d76552 12%, var(--surface-solid));
            color: color-mix(in srgb, #d76552 75%, var(--text));
            font-size: .68rem;
            font-weight: 850;
            text-align: center;
        }

        .exam-title {
            margin: 0 0 4px;
            font-size: .78rem;
            font-weight: 800;
            line-height: 1.45;
        }

        .exam-time {
            color: var(--muted);
            font-size: .68rem;
        }

        .page-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px 24px;
            padding: 22px 4px 0;
            color: var(--muted);
            font-size: .7rem;
            line-height: 1.6;
        }

        dialog {
            width: min(440px, calc(100% - 28px));
            max-height: calc(100dvh - 28px);
            margin: auto;
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--surface-solid);
            color: var(--text);
            box-shadow: 0 30px 90px rgba(0, 0, 0, .32);
        }

        dialog::backdrop {
            background: rgba(5, 12, 9, .54);
            backdrop-filter: blur(8px);
        }

        .modal-accent {
            height: 8px;
            background: var(--course);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .modal-title {
            margin: 0;
            font-size: 1.55rem;
            line-height: 1.25;
        }

        .modal-close {
            display: grid;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            place-items: center;
            border-radius: 50%;
            background: var(--surface-soft);
            font-size: 1.2rem;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 22px;
        }

        .modal-field {

        const WEEKDAYS = ["周一", "周二", "周三", "周四", "周五"];
        const KIND_LABELS = { course: "课程", exam: "考核", holiday: "假期" };
        const HUES = [154, 207, 26, 268, 338, 188, 42, 223, 115, 294, 12, 174, 50];
        const THEME_KEY = "schedule-theme-override-v1";

        const EVENTS = RAW_EVENTS.trim().split("\n").filter(Boolean).map((line, id) => {
            const [date, start, end, title, kindCode, week] = line.split(",");
            return {
                id,
                date,
                start,
                end,
                title,
                kind: { c: "course", e: "exam", h: "holiday" }[kindCode],
                week: Number(week),
                room: "地点以通知为准"
            };
        });

        const app = document.getElementById("app");
        const dialog = document.getElementById("eventDialog");
        const today = new Date();
        const initialDate = weekdayAnchor(today < TERM_START ? TERM_START : today > TERM_END ? TERM_END : today);
        const state = {
            view: "week",
            selectedDate: formatYmd(initialDate),
            weekStart: startOfWeek(initialDate),
            monthStart: new Date(initialDate.getFullYear(), initialDate.getMonth(), 1)
        };

        function formatYmd(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function parseDate(dateString) {
            return new Date(`${dateString}T12:00:00`);
        }

        function addDays(date, amount) {
            const next = new Date(date);
            next.setDate(next.getDate() + amount);
            return next;
        }

        function weekdayAnchor(date) {
            const anchor = new Date(date);
            if (anchor.getDay() === 6) return addDays(anchor, -1);
            if (anchor.getDay() === 0) return addDays(anchor, 1);
            return anchor;
        }

        function startOfWeek(date) {
            const result = new Date(date);
            const offset = (result.getDay() + 6) % 7;
            result.setDate(result.getDate() - offset);
            result.setHours(12, 0, 0, 0);
            return result;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;"
            })[char]);
        }

        function formatDate(dateString, withWeekday = true) {
            const date = parseDate(dateString);
            return new Intl.DateTimeFormat("zh-CN", {
                month: "long",
                day: "numeric",
                weekday: withWeekday ? "short" : undefined
            }).format(date);
        }

        function colorFor(title) {
            const matchedIndex = COURSE_HOURS.findIndex(course => title.includes(course.name));
            const hue = HUES[matchedIndex >= 0 ? matchedIndex : 0];
            return `hsl(${hue} 58% 52%)`;
        }

        function eventType(title, kind) {
            if (kind === "holiday") return "假期";
            if (kind === "exam") return title.includes("情景模拟") ? "情景考核" : "考试";
            if (title.includes("见习")) return "见习";
            if (title.includes("PBL")) return "PBL";
            if (title.includes("CBL")) return "CBL";
            return "课程";
        }

        function eventsOn(dateString) {
            return EVENTS.filter(event => event.date === dateString);
        }

        function currentTimeString(date = new Date()) {
            return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
        }

        function semesterStatus() {
            const current = new Date();
            const currentDay = new Date(current.getFullYear(), current.getMonth(), current.getDate(), 12);
            if (currentDay < TERM_START) {
                const days = Math.ceil((TERM_START - currentDay) / 86400000);
                return `距开课 ${days} 天`;
            }
            if (currentDay > TERM_END) return "本学期已结束";
            const week = Math.min(19, Math.floor((currentDay - TERM_START) / 604800000) + 1);
            return `教学第 ${week} 周`;
        }

        function updateContextualHeader() {
            document.getElementById("semesterStatus").textContent = semesterStatus();
            const now = new Date();
            const todayKey = formatYmd(now);
            const timeKey = currentTimeString(now);
            const nextEvent = EVENTS.find(event => event.date > todayKey || (event.date === todayKey && event.end >= timeKey));
            const card = document.getElementById("nextCard");
            if (!nextEvent) {
                card.innerHTML = `<span class="micro-label">学期进度</span><strong class="next-title">本学期安排已完成</strong><span class="next-meta">课程表覆盖至 2027 年 1 月 17 日</span>`;
                return;
            }
            card.innerHTML = `
                <span class="micro-label">下一项安排</span>
                <strong class="next-title">${escapeHtml(nextEvent.title)}</strong>
                <span class="next-meta">${formatDate(nextEvent.date)} · ${nextEvent.start}—${nextEvent.end}<br>第 ${nextEvent.week} 教学周</span>
            `;
        }

        function eventCard(event) {
            const type = eventType(event.title, event.kind);
            return `
                <button class="event-card" type="button" data-event-id="${event.id}" data-kind="${event.kind}" style="--course:${colorFor(event.title)}" ${event.kind === "holiday" ? "aria-disabled=\"true\"" : ""}>
                    <span class="event-time"><span>${event.start}—${event.end}</span><span class="event-type">${type}</span></span>
                    <strong class="event-title">${escapeHtml(event.title)}</strong>
                </button>
            `;
        }

        function toolbar(kicker, title, unit) {
            return `
                <div class="toolbar">
                    <div class="toolbar-copy">
                        <p class="toolbar-kicker">${kicker}</p>
                        <h2 class="toolbar-title">${title}</h2>
                    </div>
                    <div class="toolbar-actions">
                        <button class="toolbar-button" type="button" data-action="prev-${unit}" aria-label="上一${unit === "week" ? "周" : "月"}">‹</button>
                        <button class="toolbar-button text-button" type="button" data-action="today">定位今日</button>
                        <button class="toolbar-button" type="button" data-action="next-${unit}" aria-label="下一${unit === "week" ? "周" : "月"}">›</button>
                    </div>
                </div>
            `;
        }

        function renderWeek() {
            const days = Array.from({ length: 5 }, (_, index) => addDays(state.weekStart, index));
            const end = days[4];
            const title = `${state.weekStart.getFullYear()} 年 ${state.weekStart.getMonth() + 1} 月 ${state.weekStart.getDate()} 日 — ${end.getMonth() + 1} 月 ${end.getDate()} 日`;
            const todayKey = formatYmd(weekdayAnchor(new Date()));
            app.innerHTML = `
                <section class="panel">
                    ${toolbar(`第 ${Math.max(1, Math.min(19, Math.floor((state.weekStart - TERM_START) / 604800000) + 1))} 教学周`, title, "week")}
                    <div class="week-board" aria-label="一周课程安排">
                        ${days.map((date, index) => {
                            const dateKey = formatYmd(date);
                            const dayEvents = eventsOn(dateKey);
                            const classes = ["day-column"];
                            if (dateKey === todayKey) classes.push("is-today");
                            if (dateKey === state.selectedDate) classes.push("is-selected");
                            return `
                                <article class="${classes.join(" ")}" data-day-column="${dateKey}">
                                    <button class="day-jump" type="button" data-date="${dateKey}">
                                        <span><span class="day-name">${WEEKDAYS[index]}</span><br><span class="day-date">${date.getMonth() + 1} 月 ${date.getDate()} 日</span></span>
                                        <span class="day-count">${dayEvents.length}</span>
                                    </button>
                                    ${dayEvents.length ? `<div class="event-list">${dayEvents.map(eventCard).join("")}</div>` : `<div class="empty-day">今天没有安排<br>留一点空白给自己</div>`}
                                </article>
                            `;
                        }).join("")}
                    </div>
                    <div class="term-note">
                        <span><strong>显示规则</strong> 周课表仅展示周一至周五；周末定位会自动落到相邻工作日。</span>
                        <span>课程与节假日安排以学院最新通知为准。</span>
                    </div>
                </section>
            `;
            requestAnimationFrame(() => {
                const selected = document.querySelector(`[data-day-column="${state.selectedDate}"]`);
                selected?.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
            });
        }

        function renderMonth() {
            const year = state.monthStart.getFullYear();
            const month = state.monthStart.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const weekdays = Array.from({ length: daysInMonth }, (_, index) => new Date(year, month, index + 1, 12))
                .filter(date => date.getDay() >= 1 && date.getDay() <= 5);
            const leadingCells = (weekdays[0].getDay() + 6) % 7;
            const days = [...Array(leadingCells).fill(null), ...weekdays];
            const todayKey = formatYmd(weekdayAnchor(new Date()));
            app.innerHTML = `
                <section class="panel">
                    ${toolbar("学期月历", `${year} 年 ${month + 1} 月`, "month")}
                    <div class="month-wrap">
                        <div class="month-grid">
                            ${WEEKDAYS.map(day => `<div class="month-weekday">${day}</div>`).join("")}
                            ${days.map(date => {
                                if (!date) return `<div class="month-day is-empty" aria-hidden="true"></div>`;
                                const dateKey = formatYmd(date);
                                const dayEvents = eventsOn(dateKey);
                                const classes = ["month-day"];
                                if (dateKey === todayKey) classes.push("is-today");
                                return `
                                    <button class="${classes.join(" ")}" type="button" data-date="${dateKey}" aria-label="查看 ${formatDate(dateKey)} 的安排">
                                        <span class="month-number">${date.getDate()} <small>${WEEKDAYS[date.getDay() - 1]}</small></span>
                                        <span class="month-events">
                                            ${dayEvents.slice(0, 4).map(event => `<span class="month-event" style="--course:${event.kind === "exam" ? "#d76552" : event.kind === "holiday" ? "#d69a31" : colorFor(event.title)}">${event.start} · ${escapeHtml(event.title)}</span>`).join("")}
                                            ${dayEvents.length > 4 ? `<span class="month-more">另 ${dayEvents.length - 4} 项</span>` : ""}
                                            ${dayEvents.length === 0 ? `<span class="month-more">无安排</span>` : ""}
                                        </span>
                                    </button>
                                `;
                            }).join("")}
                        </div>
                    </div>
                    <div class="term-note"><span>点选任意日期即可进入对应周课表。</span></div>
                </section>
            `;
        }

        function renderDashboard() {
            const sortedHours = [...COURSE_HOURS].sort((a, b) => b.hours - a.hours);
            const maxHours = sortedHours[0].hours;
            const exams = EVENTS.filter(event => event.kind === "exam");
            const formalExams = exams.filter(event => !event.title.includes("情景模拟"));
            const teachingBlocks = EVENTS.filter(event => event.kind === "course").length;
            app.innerHTML = `
                <section class="panel">
                    <div class="toolbar">
                        <div class="toolbar-copy">
                            <p class="toolbar-kicker">Semester dashboard</p>
                            <h2 class="toolbar-title">2026—2027 学年第一学期 · 数据看板</h2>
                        </div>
                    </div>
                    <div class="dashboard">
                        <div class="kpi-grid">
                            <article class="kpi-card"><span class="micro-label">课程规模</span><div class="kpi-value">13</div><p class="kpi-label">11 门必修 · 2 门选修</p></article>
                            <article class="kpi-card"><span class="micro-label">教学周期</span><div class="kpi-value">19</div><p class="kpi-label">2026.09.07—2027.01.17</p></article>
                            <article class="kpi-card"><span class="micro-label">计划学时</span><div class="kpi-value">540</div><p class="kpi-label">必修 480 · 选修 60</p></article>
                            <article class="kpi-card"><span class="micro-label">考核安排</span><div class="kpi-value">14</div><p class="kpi-label">${formalExams.length} 场正式考试 · 1 场情景考核</p></article>
                        </div>

                        <div class="dashboard-grid">
                            <article class="dashboard-card">
                                <div class="card-heading"><div><h3 class="card-title">课程学时分布</h3><p class="card-subtitle">按教学安排文件中的计划学时统计，共 ${teachingBlocks} 个授课时段</p></div></div>
                                <div class="hours-list">
                                    ${sortedHours.map(course => `
                                        <div class="hours-row">
                                            <span class="hours-name" title="${course.name}">${course.name}</span>
                                            <span class="hours-track"><span class="hours-bar" style="display:block;width:${course.hours / maxHours * 100}%"></span></span>
                                            <span class="hours-value">${course.hours} 学时</span>
                                        </div>
                                    `).join("")}
                                </div>
                            </article>

                            <article class="dashboard-card composition">
                                <div class="card-heading" style="width:100%;margin-bottom:0"><div><h3 class="card-title">教学构成</h3><p class="card-subtitle">理论、见习/实践与 PBL</p></div></div>
                                <div class="donut"><div class="donut-copy"><strong class="donut-value">540</strong><span class="donut-label">总计划学时</span></div></div>
                                <div class="legend">
                                    <div class="legend-row"><span class="legend-dot" style="--dot:var(--brand)"></span><span>理论</span><strong>326</strong></div>
                                    <div class="legend-row"><span class="legend-dot" style="--dot:var(--warm)"></span><span>见习 / 实践</span><strong>135</strong></div>
                                    <div class="legend-row"><span class="legend-dot" style="--dot:#8f79c6"></span><span>PBL</span><strong>79</strong></div>
                                </div>
                            </article>
                        </div>

                        <article class="dashboard-card">
                            <div class="card-heading"><div><h3 class="card-title">考核时间线</h3><p class="card-subtitle">正式考试时间以课程安排文件为准；具体要求另行通知</p></div></div>
                            <div class="exam-list">
                                ${exams.map(event => `
                                    <button class="exam-item" type="button" data-jump-date="${event.date}" aria-label="跳转到 ${formatDate(event.date)} 的课表">
                                        <div class="exam-date">${parseDate(event.date).getMonth() + 1}/${parseDate(event.date).getDate()}</div>
                                        <div><p class="exam-title">${escapeHtml(event.title)}</p><span class="exam-time">${event.start}—${event.end} · 第 ${event.week} 周</span></div>
                                    </button>
                                `).join("")}
                            </div>
                        </article>
                    </div>
                </section>
            `;
        }

        function render() {
            document.querySelectorAll("[data-view]").forEach(button => {
                button.setAttribute("aria-selected", String(button.dataset.view === state.view));
            });
            if (state.view === "week") renderWeek();
            if (state.view === "month") renderMonth();
            if (state.view === "dashboard") renderDashboard();
            updateContextualHeader();
        }

        function openEvent(event) {
            const courseColor = event.kind === "exam" ? "#d76552" : colorFor(event.title);
            document.getElementById("modalAccent").style.setProperty("--course", courseColor);
            document.getElementById("modalKind").textContent = eventType(event.title, event.kind);
            document.getElementById("modalTitle").textContent = event.title;
            document.getElementById("modalGrid").innerHTML = `
                <div class="modal-field"><span class="modal-field-label">日期</span><span class="modal-field-value">${formatDate(event.date)}</span></div>
                <div class="modal-field"><span class="modal-field-label">教学周</span><span class="modal-field-value">第 ${event.week} 周</span></div>
                <div class="modal-field"><span class="modal-field-label">时间</span><span class="modal-field-value">${event.start}—${event.end}</span></div>
                <div class="modal-field"><span class="modal-field-label">类型</span><span class="modal-field-value">${eventType(event.title, event.kind)}</span></div>
                <div class="modal-field wide"><span class="modal-field-label">地点</span><span class="modal-field-value">${event.room}</span></div>
            `;
            dialog.showModal();
        }

        document.querySelector(".view-tabs").addEventListener("click", event => {
            const button = event.target.closest("[data-view]");
            if (!button) return;
            state.view = button.dataset.view;
            render();
        });

        app.addEventListener("click", event => {
            const jumpButton = event.target.closest("[data-jump-date]");
            if (jumpButton) {
                const date = weekdayAnchor(parseDate(jumpButton.dataset.jumpDate));
                state.selectedDate = formatYmd(date);
                state.weekStart = startOfWeek(date);
                state.monthStart = new Date(date.getFullYear(), date.getMonth(), 1);
                state.view = "week";
                render();
                return;
            }

            const eventButton = event.target.closest("[data-event-id]");
            if (eventButton) {
                const selected = EVENTS.find(item => item.id === Number(eventButton.dataset.eventId));
                if (selected && selected.kind !== "holiday") openEvent(selected);
                return;
            }

            const dateButton = event.target.closest("[data-date]");
            if (dateButton) {
                const date = parseDate(dateButton.dataset.date);
                state.selectedDate = dateButton.dataset.date;
                if (state.view === "month") {
                    state.weekStart = startOfWeek(date);
                    state.view = "week";
                }
                render();
                return;
            }

            const actionButton = event.target.closest("[data-action]");
            if (!actionButton) return;
            const action = actionButton.dataset.action;
            if (action === "prev-week" || action === "next-week") {
                state.weekStart = addDays(state.weekStart, action === "prev-week" ? -7 : 7);
                state.selectedDate = formatYmd(state.weekStart);
            }
            if (action === "prev-month" || action === "next-month") {
                state.monthStart = new Date(state.monthStart.getFullYear(), state.monthStart.getMonth() + (action === "prev-month" ? -1 : 1), 1);
            }
            if (action === "today") {
                const current = new Date();
                const anchor = weekdayAnchor(current < TERM_START ? TERM_START : current > TERM_END ? TERM_END : current);
                state.selectedDate = formatYmd(anchor);
                state.weekStart = startOfWeek(anchor);
                state.monthStart = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
            }
            render();
        });

        document.getElementById("modalClose").addEventListener("click", () => dialog.close());
        dialog.addEventListener("click", event => {
            if (event.target === dialog) dialog.close();
        });

        function nextThemeBoundary(now = new Date()) {
            const boundary = new Date(now);
            if (now.getHours() < 8) boundary.setHours(8, 0, 0, 0);
            else if (now.getHours() < 18) boundary.setHours(18, 0, 0, 0);
            else {
                boundary.setDate(boundary.getDate() + 1);
                boundary.setHours(8, 0, 0, 0);
            }
            return boundary;
        }

        function automaticTheme(now = new Date()) {
            return now.getHours() >= 18 || now.getHours() < 8 ? "night" : "day";
        }

        function storedTheme(now = new Date()) {
            try {
                const stored = JSON.parse(localStorage.getItem(THEME_KEY));
                if (stored && stored.expiresAt > now.getTime() && ["day", "night"].includes(stored.theme)) return stored.theme;
                localStorage.removeItem(THEME_KEY);
            } catch (_) {
                localStorage.removeItem(THEME_KEY);
            }
            return automaticTheme(now);
        }

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            const night = theme === "night";
            document.getElementById("themeIcon").textContent = night ? "☀" : "☾";
            document.getElementById("themeText").textContent = night ? "日间模式" : "夜间模式";
            document.getElementById("themeToggle").setAttribute("aria-label", night ? "切换为日间模式" : "切换为夜间模式");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", night ? "#0c1210" : "#eef3ef");
        }

        document.getElementById("themeToggle").addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "night" ? "day" : "night";
            localStorage.setItem(THEME_KEY, JSON.stringify({ theme: next, expiresAt: nextThemeBoundary().getTime() }));
            applyTheme(next);
        });

        function scheduleThemeSync() {
            const delay = Math.min(nextThemeBoundary().getTime() - Date.now() + 1000, 2147483647);
            window.setTimeout(() => {
                applyTheme(storedTheme());
                scheduleThemeSync();
            }, Math.max(delay, 1000));
        }

        applyTheme(storedTheme());
        scheduleThemeSync();
        render();
    </script>
</body>

</html>
